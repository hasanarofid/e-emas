name: Deploy to aaPanel Production (posemas.web.id)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /www/wwwroot/posemas.web.id
            git config --global --add safe.directory /www/wwwroot/posemas.web.id
            git reset --hard HEAD
            git pull origin main
            
            # Diagnostic log
            DIAG_FILE="/www/wwwroot/posemas.web.id/public/deploy_diag.txt"
            echo "=== DEPLOY DIAGNOSTIC ===" > "$DIAG_FILE"
            date >> "$DIAG_FILE"
            echo "SSH User: $(whoami)" >> "$DIAG_FILE"
            ls -la /www/server/data/default.pl >> "$DIAG_FILE" 2>&1 || true
            grep -E "^DB_CONNECTION|^DB_HOST|^DB_PORT|^DB_DATABASE|^DB_USERNAME" .env >> "$DIAG_FILE" || true
            
            # Sync MySQL user 'emas_db' privileges as root
            ENV_DB_PASS=$(grep -E "^DB_PASSWORD=" .env | cut -d '=' -f2- | tr -d '"' | tr -d "'")
            
            SQL_QUERY="CREATE DATABASE IF NOT EXISTS emas_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER IF NOT EXISTS 'emas_db'@'localhost' IDENTIFIED BY '$ENV_DB_PASS'; CREATE USER IF NOT EXISTS 'emas_db'@'127.0.0.1' IDENTIFIED BY '$ENV_DB_PASS'; ALTER USER 'emas_db'@'localhost' IDENTIFIED BY '$ENV_DB_PASS'; ALTER USER 'emas_db'@'127.0.0.1' IDENTIFIED BY '$ENV_DB_PASS'; GRANT ALL PRIVILEGES ON emas_db.* TO 'emas_db'@'localhost'; GRANT ALL PRIVILEGES ON emas_db.* TO 'emas_db'@'127.0.0.1'; FLUSH PRIVILEGES;"
            
            # Try connecting to MySQL using various aaPanel root credentials
            MYSQL_ROOT_PASS=""
            if [ -f /www/server/data/default.pl ]; then
              MYSQL_ROOT_PASS=$(cat /www/server/data/default.pl)
            elif [ -f /www/server/mysql/default.pl ]; then
              MYSQL_ROOT_PASS=$(cat /www/server/mysql/default.pl)
            fi

            if [ -n "$MYSQL_ROOT_PASS" ]; then
              mysql -u root -p"$MYSQL_ROOT_PASS" -e "$SQL_QUERY" 2>> "$DIAG_FILE" || true
            fi
            mysql -e "$SQL_QUERY" 2>> "$DIAG_FILE" || \
            mysql --defaults-file=/etc/mysql/debian.cnf -e "$SQL_QUERY" 2>> "$DIAG_FILE" || \
            mysql -u root -e "$SQL_QUERY" 2>> "$DIAG_FILE" || true

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan db:seed --class=EmployeeAndPayrollSeeder --force || true
            php artisan db:seed --class=FinanceSeeder --force || true
            php artisan storage:link --quiet || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            chown -R www:www /www/wwwroot/posemas.web.id
            chmod -R 775 /www/wwwroot/posemas.web.id/storage /www/wwwroot/posemas.web.id/bootstrap/cache
            echo "Deployment finished at $(date)" >> "$DIAG_FILE"
            echo "🚀 Deployment to posemas.web.id successful!"
