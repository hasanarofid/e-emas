name: Deploy to aaPanel Production (posemas.web.id)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            export PATH=/usr/local/bin:/usr/bin:/bin:/www/server/php/83/bin:/www/server/php/82/bin:/www/server/php/81/bin:$PATH
            cd /www/wwwroot/posemas.web.id
            git config --global --add safe.directory /www/wwwroot/posemas.web.id
            echo "📥 Mengambil kode terbaru via token GitHub..."
            git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
            git reset --hard FETCH_HEAD
            echo "📌 Commit aktif di server:"
            git log -1 --oneline
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan storage:link --quiet || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            chown -R www:www /www/wwwroot/posemas.web.id
            chmod -R 775 /www/wwwroot/posemas.web.id/storage /www/wwwroot/posemas.web.id/bootstrap/cache
            echo "🚀 Deployment to posemas.web.id successful!"
